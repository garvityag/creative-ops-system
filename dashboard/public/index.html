<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AGENT OPS — agents.garvityagnik.in</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@300;400;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --neon:#00FFD1;
  --red:#FF2D55;
  --amber:#FFB800;
  --purple:#BF5FFF;
  --blue:#00A8FF;
  --bg:#03040A;
  --bg2:#070910;
  --grid:#0D1020;
}

html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:#fff;font-family:'JetBrains Mono',monospace;cursor:none}

/* CUSTOM CURSOR */
#cursor{position:fixed;width:20px;height:20px;border:1px solid var(--neon);border-radius:50%;pointer-events:none;z-index:9999;transition:transform 0.1s;mix-blend-mode:difference}
#cursor-dot{position:fixed;width:4px;height:4px;background:var(--neon);border-radius:50%;pointer-events:none;z-index:9999;transform:translate(-50%,-50%)}

/* SCAN LINE OVERLAY */
body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,255,209,0.015) 2px,rgba(0,255,209,0.015) 4px);pointer-events:none;z-index:1000}
body::after{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,0.8) 100%);pointer-events:none;z-index:999}

/* CANVAS BG */
#bg-canvas{position:fixed;inset:0;z-index:0}

/* MAIN LAYOUT */
.shell{position:fixed;inset:0;z-index:10;display:grid;grid-template-rows:64px 1fr;overflow:hidden}

/* ── TOPBAR ── */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 28px;border-bottom:1px solid rgba(0,255,209,0.1);background:rgba(3,4,10,0.9);backdrop-filter:blur(20px);position:relative;overflow:hidden}
.topbar::before{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--neon),transparent);animation:scanH 4s linear infinite}
@keyframes scanH{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}

.logo-block{display:flex;align-items:baseline;gap:12px}
.logo-main{font-family:'Orbitron',sans-serif;font-size:18px;font-weight:900;color:var(--neon);letter-spacing:0.1em;text-shadow:0 0 20px rgba(0,255,209,0.5)}
.logo-sub{font-size:9px;color:rgba(0,255,209,0.4);letter-spacing:0.3em}
.domain-tag{font-size:9px;color:rgba(255,255,255,0.2);letter-spacing:0.15em;border:1px solid rgba(255,255,255,0.06);padding:3px 10px;border-radius:2px}

.topbar-center{display:flex;align-items:center;gap:24px}
.sys-metric{text-align:center}
.sm-val{font-family:'Orbitron',sans-serif;font-size:20px;font-weight:700;color:var(--neon);line-height:1}
.sm-lbl{font-size:7px;letter-spacing:0.2em;color:rgba(255,255,255,0.2);margin-top:2px}

.topbar-right{display:flex;align-items:center;gap:16px}
.live-badge{display:flex;align-items:center;gap:6px;font-size:9px;letter-spacing:0.2em;color:var(--neon);border:1px solid rgba(0,255,209,0.2);padding:4px 10px;border-radius:2px}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--neon);animation:livepulse 1.5s infinite;box-shadow:0 0 8px var(--neon)}
.live-dot.err{background:var(--red);box-shadow:0 0 8px var(--red);animation:none}
@keyframes livepulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.3;transform:scale(0.8)}}
.clock-display{font-family:'Orbitron',sans-serif;font-size:13px;color:rgba(255,255,255,0.3);letter-spacing:0.1em}

/* ── BODY ── */
.body{display:grid;grid-template-columns:280px 1fr 300px;height:100%;overflow:hidden}

/* ── LEFT PANEL ── */
.left-panel{border-right:1px solid rgba(0,255,209,0.06);background:rgba(3,4,10,0.95);overflow-y:auto;padding:16px 0}
.left-panel::-webkit-scrollbar{width:2px}
.left-panel::-webkit-scrollbar-thumb{background:rgba(0,255,209,0.2)}

.panel-label{font-size:7px;letter-spacing:0.35em;color:rgba(0,255,209,0.3);padding:0 20px;margin-bottom:16px;text-transform:uppercase}

.agent-tile{position:relative;padding:14px 20px;cursor:pointer;border-left:2px solid transparent;transition:all 0.2s;overflow:hidden;margin-bottom:1px}
.agent-tile::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,255,209,0.03),transparent);opacity:0;transition:opacity 0.2s}
.agent-tile:hover::before,.agent-tile.sel::before{opacity:1}
.agent-tile.sel{border-left-color:var(--ac);background:rgba(0,255,209,0.02)}
.agent-tile.offline{opacity:0.3}

.tile-top{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.tile-icon{width:36px;height:36px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:14px;position:relative;border:1px solid var(--ac);background:color-mix(in srgb,var(--ac) 8%,transparent);color:var(--ac);flex-shrink:0;transition:all 0.2s}
.agent-tile:hover .tile-icon,.agent-tile.sel .tile-icon{box-shadow:0 0 16px color-mix(in srgb,var(--ac) 30%,transparent)}
.status-ring{position:absolute;inset:-3px;border-radius:6px;border:1px solid var(--sc);animation:ringpulse 2s infinite;opacity:0}
.agent-tile.online .status-ring{opacity:1}
@keyframes ringpulse{0%,100%{opacity:0.6;transform:scale(1)}50%{opacity:0;transform:scale(1.1)}}

.tile-info{flex:1;min-width:0}
.tile-name{font-family:'Orbitron',sans-serif;font-size:13px;font-weight:700;letter-spacing:0.05em;color:rgba(255,255,255,0.9)}
.tile-role{font-size:8px;color:rgba(255,255,255,0.2);letter-spacing:0.08em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.tile-status-badge{font-size:7px;letter-spacing:0.12em;padding:2px 7px;border-radius:2px;border:1px solid;text-transform:uppercase;flex-shrink:0}

.tile-bar{height:1px;background:rgba(255,255,255,0.03);position:relative;overflow:hidden;margin-top:8px}
.tile-bar-fill{position:absolute;left:0;top:0;height:100%;background:var(--ac);transition:width 1s ease;box-shadow:2px 0 8px var(--ac)}

.funny-msg{font-size:8px;color:rgba(255,255,255,0.15);font-style:italic;margin-top:4px;line-height:1.4}

/* ── MAIN PANEL ── */
.main-panel{overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:18px}
.main-panel::-webkit-scrollbar{width:2px}
.main-panel::-webkit-scrollbar-thumb{background:rgba(0,255,209,0.15)}

/* STAT CARDS */
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat-card{background:var(--bg2);border:1px solid rgba(0,255,209,0.06);border-radius:4px;padding:16px;position:relative;overflow:hidden;cursor:default}
.stat-card::after{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--neon),transparent);opacity:0.3}
.sc-val{font-family:'Bebas Neue',sans-serif;font-size:48px;line-height:1;color:var(--neon);text-shadow:0 0 30px rgba(0,255,209,0.3);letter-spacing:0.02em}
.sc-lbl{font-size:7px;letter-spacing:0.25em;color:rgba(255,255,255,0.2);margin-top:4px;text-transform:uppercase}
.sc-sub{font-size:8px;color:rgba(255,255,255,0.1);margin-top:2px}
.sc-corner{position:absolute;bottom:8px;right:10px;font-family:'Orbitron',sans-serif;font-size:7px;color:rgba(255,255,255,0.05);letter-spacing:0.2em}

/* PIPELINE */
.pipeline-section{background:var(--bg2);border:1px solid rgba(0,255,209,0.06);border-radius:4px;padding:18px;position:relative;overflow:hidden}
.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.section-title{font-family:'Orbitron',sans-serif;font-size:10px;font-weight:700;letter-spacing:0.2em;color:rgba(255,255,255,0.4)}
.section-meta{font-size:8px;color:rgba(0,255,209,0.4);letter-spacing:0.1em}

.pip-empty{text-align:center;padding:24px 0;font-size:11px;color:rgba(255,255,255,0.1);font-style:italic;letter-spacing:0.1em}

.pip-track{display:flex;align-items:center;overflow-x:auto;padding-bottom:4px;gap:0}
.pip-track::-webkit-scrollbar{height:2px}
.pip-track::-webkit-scrollbar-thumb{background:rgba(0,255,209,0.2)}

.pip-node{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:70px}
.pip-hex{width:40px;height:40px;position:relative;display:flex;align-items:center;justify-content:center;font-size:13px}
.pip-hex::before{content:'';position:absolute;inset:0;background:color-mix(in srgb,var(--ac) 10%,transparent);clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);transition:all 0.3s}
.pip-hex.done::before{background:color-mix(in srgb,var(--ac) 25%,transparent)}
.pip-hex.current::before{background:color-mix(in srgb,var(--ac) 15%,transparent);animation:hexglow 2s infinite}
.pip-hex.pending::before{background:rgba(255,255,255,0.02)}
@keyframes hexglow{0%,100%{filter:drop-shadow(0 0 6px var(--ac))}50%{filter:drop-shadow(0 0 14px var(--ac))}}
.pip-hex-icon{position:relative;z-index:1;color:var(--ac)}
.pip-hex.pending .pip-hex-icon{color:rgba(255,255,255,0.1)}
.pip-lbl{font-size:8px;letter-spacing:0.05em;color:rgba(255,255,255,0.3);text-align:center}
.pip-lbl.active{color:var(--ac)}
.pip-st{font-size:7px;text-align:center;letter-spacing:0.08em}

.pip-connector{flex:1;min-width:20px;height:1px;position:relative;margin-bottom:22px}
.pip-connector::before{content:'';position:absolute;inset:0;background:rgba(255,255,255,0.05)}
.pip-connector.done-con::before{background:var(--neon);box-shadow:0 0 6px rgba(0,255,209,0.4)}
.pip-connector::after{content:'▶';position:absolute;right:-4px;top:-5px;font-size:8px;color:rgba(255,255,255,0.1)}
.pip-connector.done-con::after{color:var(--neon)}

/* TASK BOARD */
.tasks-section{}
.tasks-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.task-card{background:var(--bg2);border:1px solid rgba(255,255,255,0.04);border-radius:4px;padding:14px;border-left:2px solid var(--ac);position:relative;overflow:hidden;cursor:pointer;transition:all 0.2s}
.task-card:hover{border-color:rgba(255,255,255,0.08);background:rgba(255,255,255,0.02)}
.task-card::before{content:'';position:absolute;top:0;left:0;right:0;height:100%;background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 3%,transparent),transparent);pointer-events:none}
.tc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.tc-agent{font-family:'Orbitron',sans-serif;font-size:10px;font-weight:700;color:var(--ac);letter-spacing:0.08em}
.tc-badge{font-size:7px;padding:2px 7px;border-radius:2px;border:1px solid;letter-spacing:0.1em;text-transform:uppercase}
.b-busy{color:#FFB800;border-color:rgba(255,184,0,0.3);background:rgba(255,184,0,0.05)}
.b-waiting{color:var(--purple);border-color:rgba(191,95,255,0.3);background:rgba(191,95,255,0.05)}
.b-queued{color:rgba(255,255,255,0.2);border-color:rgba(255,255,255,0.08)}
.tc-title{font-size:10px;color:rgba(255,255,255,0.5);line-height:1.6;margin-bottom:8px}
.tc-prog-track{height:1px;background:rgba(255,255,255,0.05);position:relative;overflow:visible}
.tc-prog-fill{position:absolute;left:0;top:0;height:100%;transition:width 2s ease;box-shadow:2px 0 8px var(--ac)}
.tc-prog-dot{position:absolute;right:-2px;top:-2px;width:5px;height:5px;border-radius:50%;background:var(--ac);box-shadow:0 0 6px var(--ac)}
.tc-meta{display:flex;justify-content:space-between;margin-top:6px;font-size:8px;color:rgba(255,255,255,0.15)}
.no-tasks{grid-column:1/-1;text-align:center;padding:40px;font-size:11px;color:rgba(255,255,255,0.08);font-style:italic;letter-spacing:0.15em;border:1px dashed rgba(255,255,255,0.04);border-radius:4px}

/* FEED */
.feed-section{background:var(--bg2);border:1px solid rgba(0,255,209,0.06);border-radius:4px;overflow:hidden}
.feed-head{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid rgba(255,255,255,0.03);font-size:8px;letter-spacing:0.25em;color:rgba(255,255,255,0.2)}
.feed-head-dot{width:4px;height:4px;border-radius:50%;background:var(--neon);animation:livepulse 2s infinite}
.feed-scroll{max-height:160px;overflow-y:auto}
.feed-scroll::-webkit-scrollbar{width:2px}
.feed-scroll::-webkit-scrollbar-thumb{background:rgba(0,255,209,0.1)}
.feed-row{display:flex;align-items:flex-start;gap:10px;padding:8px 16px;border-bottom:1px solid rgba(255,255,255,0.02);animation:feedin 0.4s ease}
@keyframes feedin{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}
.fr-dot{width:4px;height:4px;border-radius:50%;margin-top:5px;flex-shrink:0}
.fr-txt{font-size:9px;color:rgba(255,255,255,0.25);line-height:1.6;flex:1}
.fr-txt b{font-weight:400}
.fr-time{font-size:8px;color:rgba(255,255,255,0.1);white-space:nowrap;flex-shrink:0;padding-top:2px;font-variant-numeric:tabular-nums}
.feed-empty{padding:20px;text-align:center;font-size:9px;color:rgba(255,255,255,0.08);font-style:italic}

/* ── RIGHT PANEL ── */
.right-panel{border-left:1px solid rgba(0,255,209,0.06);background:rgba(3,4,10,0.95);overflow-y:auto;padding:18px}
.right-panel::-webkit-scrollbar{width:2px}
.right-panel::-webkit-scrollbar-thumb{background:rgba(0,255,209,0.2)}

.rp-label{font-size:7px;letter-spacing:0.35em;color:rgba(0,255,209,0.3);margin-bottom:14px;text-transform:uppercase}

/* NOVA ALERT */
.nova-alert{background:rgba(191,95,255,0.04);border:1px solid rgba(191,95,255,0.2);border-radius:4px;padding:14px;margin-bottom:16px;position:relative;overflow:hidden;animation:novapulse 3s infinite}
.nova-alert::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--purple),transparent);animation:scanH 3s linear infinite}
@keyframes novapulse{0%,100%{border-color:rgba(191,95,255,0.2)}50%{border-color:rgba(191,95,255,0.5)}}
.nova-eyebrow{font-size:7px;letter-spacing:0.25em;color:var(--purple);margin-bottom:6px}
.nova-body{font-size:9px;color:rgba(255,255,255,0.3);line-height:1.7;margin-bottom:10px}
.nova-btns{display:flex;gap:6px}
.nova-btn{font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:0.1em;padding:5px 12px;border-radius:2px;cursor:pointer;border:1px solid;transition:all 0.15s;text-transform:uppercase}
.nb-onboard{background:rgba(191,95,255,0.1);border-color:rgba(191,95,255,0.4);color:var(--purple)}
.nb-onboard:hover{background:rgba(191,95,255,0.2)}
.nb-skip{background:transparent;border-color:rgba(255,255,255,0.06);color:rgba(255,255,255,0.2)}

/* AGENT DETAIL */
.detail-card{background:var(--bg2);border:1px solid rgba(0,255,209,0.06);border-radius:4px;padding:16px;margin-bottom:14px;position:relative;overflow:hidden}
.detail-card::after{content:'';position:absolute;top:0;left:0;bottom:0;width:1px;background:var(--ac);opacity:0.4}
.dc-name{font-family:'Bebas Neue',sans-serif;font-size:36px;letter-spacing:0.05em;line-height:1;color:var(--ac);text-shadow:0 0 20px color-mix(in srgb,var(--ac) 30%,transparent)}
.dc-role{font-size:8px;letter-spacing:0.15em;color:rgba(255,255,255,0.2);margin-bottom:14px;margin-top:2px}
.dc-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid rgba(255,255,255,0.03)}
.dc-k{font-size:7px;letter-spacing:0.2em;color:rgba(255,255,255,0.15);text-transform:uppercase}
.dc-v{font-size:9px;color:rgba(255,255,255,0.4);text-align:right}

/* INSTALLED CHIPS */
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,0.03)}
.chip{font-size:7px;letter-spacing:0.1em;padding:3px 8px;border-radius:2px;border:1px solid rgba(255,255,255,0.06);color:rgba(255,255,255,0.15);text-transform:uppercase}
.chip.on{border-color:color-mix(in srgb,var(--ac) 40%,transparent);color:var(--ac);background:color-mix(in srgb,var(--ac) 6%,transparent)}

/* FUNNY STATUS */
.funny-detail{margin-top:10px;padding:10px;background:rgba(255,255,255,0.02);border-radius:3px;border:1px dashed rgba(255,255,255,0.05);font-size:9px;color:rgba(255,255,255,0.15);font-style:italic;line-height:1.6}

/* QUICK UPDATE */
.qupdate{margin-top:14px}
.qu-label{font-size:7px;letter-spacing:0.25em;color:rgba(255,255,255,0.15);margin-bottom:8px;text-transform:uppercase}
.qu-btns{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.qu-btn{font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:0.1em;padding:7px 10px;border-radius:2px;cursor:pointer;border:1px solid rgba(255,255,255,0.06);background:transparent;color:rgba(255,255,255,0.2);transition:all 0.15s;text-transform:uppercase;text-align:left}
.qu-btn:hover{border-color:var(--neon);color:var(--neon);background:rgba(0,255,209,0.04)}
.qu-btn.current-s{border-color:var(--ac);color:var(--ac);background:color-mix(in srgb,var(--ac) 6%,transparent)}

/* DETAIL PROGRESS */
.dp-prog{margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,0.03)}
.dp-task{font-size:9px;color:rgba(255,255,255,0.25);margin-bottom:6px;line-height:1.5}
.dp-bar{height:1px;background:rgba(255,255,255,0.05);position:relative}
.dp-fill{position:absolute;left:0;top:0;height:100%;background:var(--ac);box-shadow:0 0 8px var(--ac);transition:width 1s}
.dp-pct{font-size:7px;color:rgba(255,255,255,0.15);text-align:right;margin-top:3px}

/* ERR BANNER */
.err-banner{position:fixed;top:0;left:0;right:0;z-index:500;background:rgba(255,45,85,0.1);border-bottom:1px solid rgba(255,45,85,0.3);padding:6px 28px;font-size:9px;color:var(--red);letter-spacing:0.08em;display:none}

/* GLITCH on logo */
.logo-main{animation:glitch 8s infinite}
@keyframes glitch{0%,95%,100%{text-shadow:0 0 20px rgba(0,255,209,0.5)}96%{text-shadow:-2px 0 var(--red),2px 0 var(--blue),0 0 20px rgba(0,255,209,0.5)}97%{text-shadow:2px 0 var(--red),-2px 0 var(--blue),0 0 20px rgba(0,255,209,0.5)}98%{text-shadow:0 0 20px rgba(0,255,209,0.5)}}
</style>
</head>
<body>

<div id="cursor"></div>
<div id="cursor-dot"></div>
<canvas id="bg-canvas"></canvas>
<div class="err-banner" id="err-banner">⚠ STATUS API UNREACHABLE — CACHED DATA</div>

<div class="shell">

  <!-- TOPBAR -->
  <div class="topbar">
    <div class="logo-block">
      <div class="logo-main">AGENT OPS</div>
      <div class="logo-sub">CREATIVE SYSTEM v1.0</div>
    </div>
    <div class="domain-tag">agents.garvityagnik.in</div>

    <div class="topbar-center">
      <div class="sys-metric"><div class="sm-val" id="s-online">—</div><div class="sm-lbl">online</div></div>
      <div style="width:1px;height:24px;background:rgba(255,255,255,0.05)"></div>
      <div class="sys-metric"><div class="sm-val" id="s-busy" style="color:#FFB800">—</div><div class="sm-lbl">working</div></div>
      <div style="width:1px;height:24px;background:rgba(255,255,255,0.05)"></div>
      <div class="sys-metric"><div class="sm-val" id="s-waiting" style="color:var(--purple)">—</div><div class="sm-lbl">waiting</div></div>
      <div style="width:1px;height:24px;background:rgba(255,255,255,0.05)"></div>
      <div class="sys-metric"><div class="sm-val" id="s-done" style="color:var(--blue)">—</div><div class="sm-lbl">done today</div></div>
    </div>

    <div class="topbar-right">
      <div class="live-badge">
        <div class="live-dot" id="live-dot"></div>
        <span id="conn-lbl">CONNECTING</span>
      </div>
      <div class="clock-display" id="clock">--:--:--</div>
    </div>
  </div>

  <!-- BODY -->
  <div class="body">

    <!-- LEFT -->
    <div class="left-panel">
      <div class="panel-label">Agent Roster</div>
      <div id="agent-list"></div>
    </div>

    <!-- MAIN -->
    <div class="main-panel">

      <!-- PIPELINE -->
      <div class="pipeline-section">
        <div class="section-head">
          <div class="section-title" id="pip-title">NO ACTIVE PIPELINE</div>
          <div class="section-meta" id="pip-step"></div>
        </div>
        <div id="pip-wrap"></div>
      </div>

      <!-- TASKS -->
      <div class="tasks-section">
        <div class="section-head" style="margin-bottom:12px">
          <div class="section-title">LIVE TASK BOARD</div>
          <div class="section-meta" id="last-upd">—</div>
        </div>
        <div class="tasks-grid" id="tasks-grid"></div>
      </div>

      <!-- FEED -->
      <div class="feed-section">
        <div class="feed-head">
          <div class="feed-head-dot"></div>
          ACTIVITY STREAM
        </div>
        <div class="feed-scroll" id="feed-scroll"></div>
      </div>

    </div>

    <!-- RIGHT -->
    <div class="right-panel">
      <div class="rp-label">Control</div>
      <div id="nova-zone"></div>
      <div id="detail-zone"></div>
    </div>

  </div>
</div>

<script>
// ── CURSOR ──────────────────────────────────────────────────
const cur = document.getElementById('cursor');
const curDot = document.getElementById('cursor-dot');
let mx=0,my=0,cx=0,cy=0;
document.addEventListener('mousemove',e=>{
  mx=e.clientX; my=e.clientY;
  curDot.style.left=mx+'px'; curDot.style.top=my+'px';
});
(function animCursor(){
  cx+=(mx-cx)*0.15; cy+=(my-cy)*0.15;
  cur.style.left=(cx-10)+'px'; cur.style.top=(cy-10)+'px';
  requestAnimationFrame(animCursor);
})();

// ── PARTICLE BG ──────────────────────────────────────────────
const cv=document.getElementById('bg-canvas');
const ctx=cv.getContext('2d');
cv.width=window.innerWidth; cv.height=window.innerHeight;
window.addEventListener('resize',()=>{cv.width=window.innerWidth;cv.height=window.innerHeight});

const NODES=55;
const nodes=Array.from({length:NODES},()=>({
  x:Math.random()*cv.width, y:Math.random()*cv.height,
  vx:(Math.random()-0.5)*0.3, vy:(Math.random()-0.5)*0.3,
  r:Math.random()*1.5+0.5, pulse:Math.random()*Math.PI*2
}));

function drawBG(t){
  ctx.clearRect(0,0,cv.width,cv.height);
  // grid
  ctx.strokeStyle='rgba(0,255,209,0.015)';
  ctx.lineWidth=1;
  for(let x=0;x<cv.width;x+=60){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,cv.height);ctx.stroke()}
  for(let y=0;y<cv.height;y+=60){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(cv.width,y);ctx.stroke()}
  // connections
  for(let i=0;i<NODES;i++){
    for(let j=i+1;j<NODES;j++){
      const dx=nodes[i].x-nodes[j].x, dy=nodes[i].y-nodes[j].y;
      const d=Math.sqrt(dx*dx+dy*dy);
      if(d<140){
        ctx.strokeStyle=`rgba(0,255,209,${0.06*(1-d/140)})`;
        ctx.lineWidth=0.5;
        ctx.beginPath();ctx.moveTo(nodes[i].x,nodes[i].y);ctx.lineTo(nodes[j].x,nodes[j].y);ctx.stroke();
      }
    }
  }
  // nodes
  nodes.forEach((n,i)=>{
    n.pulse+=0.02;
    const a=0.3+0.2*Math.sin(n.pulse);
    ctx.beginPath();ctx.arc(n.x,n.y,n.r,0,Math.PI*2);
    ctx.fillStyle=`rgba(0,255,209,${a})`;ctx.fill();
    n.x+=n.vx; n.y+=n.vy;
    if(n.x<0||n.x>cv.width)n.vx*=-1;
    if(n.y<0||n.y>cv.height)n.vy*=-1;
  });
}
(function loop(t){drawBG(t);requestAnimationFrame(loop)})();

// ── DATA ─────────────────────────────────────────────────────
const API='/api/status';
const POLL=30000;
const FUNNY={
  aria:["Waiting for orders, boss.","Refreshing the pipeline for the 88th time.","Playing 4D chess with task queues.","Orchestrating silence."],
  desi:["Adjusting kerning by 0.1px… again.","Playing pool in the break room. 🎱","Debating serif vs sans internally.","Staring at the Pantone book."],
  idea:["Daydreaming about gradients.","Having an existential crisis about Comic Sans.","Lo-fi beats + blank canvas = ideating.","Sketching on digital napkins."],
  mova:["Watching AE render… forever. 🎬","Playing a 15s loop. On repeat.","Calculating frame rates for fun.","Easing functions. Just easing functions."],
  bryn:["Reading a 47-page brief doc. For fun.","Strategically sipping chai. ☕","Rewriting the brief nobody asked for.","In the zone. Do not disturb."],
  copy:["Thesaurus open, vibes immaculate.","Finding the perfect em dash — ","Writing headlines nobody will use. ✍️","Speedrunning 'just one more draft'."],
  soci:["Scrolling for 'research'. Sure. 📱","Hashtagging hashtags with hashtags.","Waiting for the algorithm to make sense.","Calculating optimal post time. Again."],
  arch:["Building workflows nobody asked for.","Diagramming the diagram diagram. 🗂️","YAML goes brrr.","Optimising the optimisation."],
  nova:["Scouting for new talent. 🔍","Reading CVs from imaginary agents.","Gap detected: no Coffee Agent. Investigating.","Playing HR simulator 2026."],
};
const PLAT={'claude-projects':'Claude Projects','claude-code':'Claude Code','api':'API','n8n':'n8n','make':'Make.com'};
const SC={active:'#00FFD1',busy:'#FFB800',waiting:'#BF5FFF',idle:'rgba(255,255,255,0.15)',offline:'rgba(255,255,255,0.06)'};
const SL={active:'ACTIVE',busy:'BUSY',waiting:'WAITING',idle:'IDLE',offline:'OFFLINE'};

let state=null, selId='aria', feedLog=[], secret=null;

function funny(id){const m=FUNNY[id]||['Chilling.'];return m[Math.floor(Math.random()*m.length)]}

// ── FETCH ─────────────────────────────────────────────────────
async function fetchStatus(){
  try{
    const r=await fetch(API+'?t='+Date.now());
    if(!r.ok)throw new Error();
    const d=await r.json();
    document.getElementById('err-banner').style.display='none';
    document.getElementById('live-dot').className='live-dot';
    document.getElementById('conn-lbl').textContent='LIVE';
    return d;
  }catch(e){
    document.getElementById('err-banner').style.display='block';
    document.getElementById('live-dot').className='live-dot err';
    document.getElementById('conn-lbl').textContent='OFFLINE';
    return null;
  }
}

// ── RENDER SIDEBAR ────────────────────────────────────────────
function renderSidebar(agents){
  document.getElementById('agent-list').innerHTML=Object.values(agents).map(a=>{
    const isIdle=a.status==='idle',isOff=a.status==='offline';
    const sc=SC[a.status]||SC.idle;
    const taskPct=a.tasks_completed_today>0?Math.min(100,a.tasks_completed_today*10):0;
    return`<div class="agent-tile ${selId===a.id?'sel':''} ${!isOff&&!isIdle?'online':''} ${isOff?'offline':''}"
      style="--ac:${a.color};--sc:${sc}" onclick="selectAgent('${a.id}')">
      <div class="tile-top">
        <div class="tile-icon">${a.emoji}<div class="status-ring" style="--ac:${sc}"></div></div>
        <div class="tile-info">
          <div class="tile-name">${a.name}</div>
          <div class="tile-role">${a.role}</div>
        </div>
        <div class="tile-status-badge" style="color:${sc};border-color:${sc}30;background:${sc}08">${SL[a.status]||'—'}</div>
      </div>
      ${(isIdle||isOff)?`<div class="funny-msg">${isOff?'🔌 Not installed anywhere':funny(a.id)}</div>`:''}
      ${a.current_task&&!isIdle&&!isOff?`<div style="font-size:8px;color:rgba(255,255,255,0.2);margin-top:4px;line-height:1.5">${a.current_task}</div>`:''}
      <div class="tile-bar"><div class="tile-bar-fill" style="width:${taskPct}%;background:${a.color}"></div></div>
    </div>`;
  }).join('');
}

// ── RENDER STATS ──────────────────────────────────────────────
function renderStats(agents){
  const v=Object.values(agents);
  document.getElementById('s-online').textContent=v.filter(a=>a.status!=='offline').length;
  document.getElementById('s-busy').textContent=v.filter(a=>a.status==='busy'||a.status==='active').length;
  document.getElementById('s-waiting').textContent=v.filter(a=>a.status==='waiting').length;
  document.getElementById('s-done').textContent=v.reduce((s,a)=>s+(a.tasks_completed_today||0),0);
}

// ── RENDER PIPELINE ───────────────────────────────────────────
function renderPipeline(pip){
  const wrap=document.getElementById('pip-wrap');
  if(!pip||!pip.active_project){
    document.getElementById('pip-title').textContent='NO ACTIVE PIPELINE';
    document.getElementById('pip-step').textContent='';
    wrap.innerHTML=`<div class="pip-empty">— Drop a brief to ARIA to start a pipeline —</div>`;
    return;
  }
  const steps=pip.steps||[];
  const ci=steps.findIndex(s=>s.state==='current');
  document.getElementById('pip-title').textContent='PIPELINE — '+pip.active_project.toUpperCase();
  document.getElementById('pip-step').textContent=ci>=0?`STEP ${ci+1} / ${steps.length}`:'';
  wrap.innerHTML=`<div class="pip-track">${steps.map((s,i)=>`
    ${i>0?`<div class="pip-connector ${steps[i-1].state==='done'?'done-con':''}"></div>`:''}
    <div class="pip-node" style="--ac:${s.color||'#444'}">
      <div class="pip-hex ${s.state}">
        <div class="pip-hex-icon" style="color:${s.state==='pending'?'rgba(255,255,255,0.1)':s.color}">${s.state==='done'?'✓':s.emoji||'○'}</div>
      </div>
      <div class="pip-lbl ${s.state==='current'?'active':''}" style="color:${s.state==='pending'?'rgba(255,255,255,0.1)':s.state==='done'?'rgba(0,255,209,0.5)':s.color}">${s.name}</div>
      <div class="pip-st" style="color:${s.state==='done'?'rgba(0,255,209,0.4)':s.state==='current'?s.color:'rgba(255,255,255,0.05)'}">${s.state==='done'?'done':s.state==='current'?'●':''}</div>
    </div>
  `).join('')}</div>`;
}

// ── RENDER TASKS ──────────────────────────────────────────────
function renderTasks(agents){
  const grid=document.getElementById('tasks-grid');
  const active=Object.values(agents).filter(a=>a.current_task&&a.status!=='idle'&&a.status!=='offline');
  if(!active.length){
    grid.innerHTML=`<div class="no-tasks">— All agents idle. System quiet. —</div>`;
    return;
  }
  grid.innerHTML=active.map(a=>`
    <div class="task-card" style="--ac:${a.color}">
      <div class="tc-top">
        <div class="tc-agent" style="color:${a.color}">${a.name}</div>
        <div class="tc-badge b-${a.status==='waiting'?'waiting':a.status==='busy'?'busy':'queued'}">${a.status}</div>
      </div>
      <div class="tc-title">${a.current_task}${a.current_project?`<br><span style="color:rgba(255,255,255,0.12);font-size:8px">${a.current_project}</span>`:''}</div>
      <div class="tc-prog-track">
        <div class="tc-prog-fill" style="width:${a.status==='waiting'?100:55}%;background:${a.color}">
          <div class="tc-prog-dot" style="background:${a.color};box-shadow:0 0 6px ${a.color}"></div>
        </div>
      </div>
      <div class="tc-meta"><span>in progress</span><span>${a.status==='waiting'?'awaiting you':'—'}</span></div>
    </div>
  `).join('');
}

// ── RENDER FEED ───────────────────────────────────────────────
function renderFeed(){
  const el=document.getElementById('feed-scroll');
  if(!feedLog.length){el.innerHTML=`<div class="feed-empty">No activity yet — system is quiet.</div>`;return}
  el.innerHTML=feedLog.slice(0,14).map(f=>`
    <div class="feed-row">
      <div class="fr-dot" style="background:${f.color}"></div>
      <div class="fr-txt"><b style="color:${f.color}">${f.agent}</b> — ${f.text}</div>
      <div class="fr-time">${f.time}</div>
    </div>
  `).join('');
}

// ── RENDER NOVA ───────────────────────────────────────────────
function renderNova(alerts){
  const z=document.getElementById('nova-zone');
  if(!alerts||!alerts.length){z.innerHTML='';return}
  z.innerHTML=alerts.map((al,i)=>`
    <div class="nova-alert">
      <div class="nova-eyebrow">✳ NOVA ALERT</div>
      <div class="nova-body">${al.message}</div>
      <div class="nova-btns">
        <button class="nova-btn nb-onboard" onclick="onboard(${i})">ONBOARD</button>
        <button class="nova-btn nb-skip" onclick="dismissNova(${i})">SKIP</button>
      </div>
    </div>
  `).join('');
}

// ── RENDER DETAIL ─────────────────────────────────────────────
function renderDetail(agents){
  const a=agents[selId]; if(!a) return;
  const sc=SC[a.status]||SC.idle;
  const isIdle=a.status==='idle', isOff=a.status==='offline';
  const inst=a.installed_in||[];
  document.getElementById('detail-zone').innerHTML=`
    <div class="detail-card" style="--ac:${a.color}">
      <div class="dc-name" style="color:${a.color};text-shadow:0 0 20px ${a.color}40">${a.name}</div>
      <div class="dc-role">${a.role}</div>
      <div class="dc-row"><div class="dc-k">STATUS</div><div class="dc-v" style="color:${sc}">${SL[a.status]||'—'}</div></div>
      <div class="dc-row"><div class="dc-k">CURRENT TASK</div><div class="dc-v">${a.current_task||'—'}</div></div>
      <div class="dc-row"><div class="dc-k">PROJECT</div><div class="dc-v">${a.current_project||'—'}</div></div>
      <div class="dc-row"><div class="dc-k">DONE TODAY</div><div class="dc-v">${a.tasks_completed_today||0}</div></div>
      <div class="dc-row"><div class="dc-k">UPTIME</div><div class="dc-v">${a.uptime_percent||'—'}%</div></div>
      <div class="chips">${['claude-projects','claude-code','api','n8n','make'].map(p=>`<div class="chip ${inst.includes(p)?'on':''}" style="${inst.includes(p)?`--ac:${a.color}`:''}">
        ${PLAT[p]}</div>`).join('')}</div>
      ${(isIdle||isOff)?`<div class="funny-detail">${isOff?'🔌 Offline — not installed in any platform.':'💤 '+funny(a.id)}</div>`:''}
      ${a.current_task&&!isIdle&&!isOff?`<div class="dp-prog">
        <div class="dp-task">${a.current_task}</div>
        <div class="dp-bar"><div class="dp-fill" style="width:${a.status==='waiting'?100:55}%;background:${a.color}"></div></div>
        <div class="dp-pct">${a.status==='waiting'?'100% — awaiting approval':'in progress'}</div>
      </div>`:''}
    </div>
    <div class="qupdate">
      <div class="qu-label">Quick Update</div>
      <div class="qu-btns">
        ${['idle','busy','waiting','offline'].map(s=>`
          <button class="qu-btn ${a.status===s?'current-s':''}" style="${a.status===s?`--ac:${a.color};border-color:${a.color};color:${a.color}`:''}"
            onclick="quickUpdate('${a.id}','${s}')">
            ${s.toUpperCase()}${a.status===s?' ←':''}
          </button>`).join('')}
      </div>
    </div>
  `;
}

// ── RENDER ALL ────────────────────────────────────────────────
function renderAll(data){
  Object.keys(data.agents).forEach(k=>{data.agents[k].id=k});
  renderSidebar(data.agents);
  renderStats(data.agents);
  renderPipeline(data.pipeline);
  renderTasks(data.agents);
  renderFeed();
  renderNova(data.nova_alerts);
  renderDetail(data.agents);
  const ts=new Date(data.system?.last_updated||Date.now());
  document.getElementById('last-upd').textContent='updated '+ts.toLocaleTimeString('en-IN');
}

// ── ACTIONS ───────────────────────────────────────────────────
function selectAgent(id){selId=id;if(state)renderAll(state)}

async function quickUpdate(agentId,newStatus){
  if(!secret){
    secret=localStorage.getItem('ds')||prompt('Enter dashboard secret:');
    if(!secret)return;
    localStorage.setItem('ds',secret);
  }
  if(state&&state.agents[agentId]){
    state.agents[agentId].status=newStatus;
    if(newStatus==='idle'||newStatus==='offline'){
      state.agents[agentId].current_task=null;
      state.agents[agentId].current_project=null;
    }
    feedLog.unshift({agent:state.agents[agentId].name,color:state.agents[agentId].color,text:`Status → <b>${newStatus.toUpperCase()}</b>`,time:'just now'});
    renderAll(state);
  }
  try{
    await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({secret,agent_id:agentId,updates:{status:newStatus}})});
  }catch(e){}
}

function onboard(i){
  if(!state)return;
  const al=state.nova_alerts[i];
  feedLog.unshift({agent:'NOVA',color:'#BF5FFF',text:`<b>${al?.agent_name||'New Agent'}</b> onboarded`,time:'just now'});
  state.nova_alerts.splice(i,1);
  renderAll(state);
}
function dismissNova(i){
  if(!state)return;
  state.nova_alerts.splice(i,1);
  renderAll(state);
}

// ── POLL ──────────────────────────────────────────────────────
async function poll(){
  const data=await fetchStatus();
  if(data){state=data;renderAll(data)}
  else if(!state){
    try{const r=await fetch('/status.json');if(r.ok){state=await r.json();renderAll(state)}}catch(e){}
  }
}

// ── CLOCK ─────────────────────────────────────────────────────
function tick(){
  document.getElementById('clock').textContent=
    new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
}

tick();setInterval(tick,1000);
poll();setInterval(poll,POLL);
</script>
